# Local test only: the same wiring the Railway template uses.
services:
  spliit:
    build: .
    ports: ["3000:3000"]
    environment:
      POSTGRES_PRISMA_URL: postgresql://postgres:localtest@db:5432/railway
      POSTGRES_URL_NON_POOLING: postgresql://postgres:localtest@db:5432/railway
      BASE_URL: http://localhost:3000
      PORT: "3000"
    depends_on: [db]
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: localtest
      POSTGRES_DB: railway
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata: {}
